services:
  # Servizio interattivo da terminale o dev container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: university-notes-compiler:latest
    container_name: unipi-notes-app
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true

  # Genera le figure di Data Mining tramite lo script Python
  figures:
    build:
      context: .
      dockerfile: Dockerfile
    image: university-notes-compiler:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: python3 Data-Mining/notebooks/generate_dispensa_figures.py

  # Compila tutte le dispense (Data Mining, Algorithm Engineering, Information Retrieval)
  build:
    build:
      context: .
      dockerfile: Dockerfile
    image: university-notes-compiler:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >
      bash -c "
        for d in Algorithm-Engineering Computational-Mathematics Data-Mining Information-Retrieval; do
          if [ -d \"\$$d\" ]; then
            echo \"=== Compiling \$$d ===\"
            (cd \"\$$d\" && [ -f main_it.tex ] && latexmk -pdf -interaction=nonstopmode -emulate-aux-dir -auxdir=build main_it.tex)
            (cd \"\$$d\" && [ -f main_en.tex ] && latexmk -pdf -interaction=nonstopmode -emulate-aux-dir -auxdir=build main_en.tex)
            (cd \"\$$d\" && [ -f main.tex ] && latexmk -pdf -interaction=nonstopmode -emulate-aux-dir -auxdir=build main.tex)
          fi
        done &&
        mkdir -p pdf &&
        [ -f Computational-Mathematics/main_it.pdf ] && cp Computational-Mathematics/main_it.pdf pdf/Computational-Mathematics-IT.pdf || true &&
        [ -f Computational-Mathematics/main_en.pdf ] && cp Computational-Mathematics/main_en.pdf pdf/Computational-Mathematics-EN.pdf || true &&
        [ -f Data-Mining/main_it.pdf ] && cp Data-Mining/main_it.pdf pdf/Data-Mining-IT.pdf || true &&
        [ -f Data-Mining/main_en.pdf ] && cp Data-Mining/main_en.pdf pdf/Data-Mining-EN.pdf || true &&
        [ -f Algorithm-Engineering/main_it.pdf ] && cp Algorithm-Engineering/main_it.pdf pdf/Algorithm-Engineering-IT.pdf || true &&
        [ -f Algorithm-Engineering/main_en.pdf ] && cp Algorithm-Engineering/main_en.pdf pdf/Algorithm-Engineering-EN.pdf || true &&
        [ -f Information-Retrieval/main_it.pdf ] && cp Information-Retrieval/main_it.pdf pdf/Information-Retrieval-IT.pdf || true &&
        [ -f Information-Retrieval/main_en.pdf ] && cp Information-Retrieval/main_en.pdf pdf/Information-Retrieval-EN.pdf || true &&
        echo '=== Build completata con successo! PDF sincronizzati in pdf/ ==='
      "

  # Pulisce i file ausiliari di compilazione
  clean:
    build:
      context: .
      dockerfile: Dockerfile
    image: university-notes-compiler:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >
      bash -c "
        for d in Algorithm-Engineering Computational-Mathematics Data-Mining Information-Retrieval; do
          if [ -d \"\$$d\" ]; then
            (cd \"\$$d\" && latexmk -emulate-aux-dir -auxdir=build -c && rm -rf build)
          fi
        done &&
        echo '=== Pulizia file ausiliari completata ==='
      "

  # Ambiente interattivo Jupyter Notebook / Lab per Data Mining
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: university-notes-compiler:latest
    container_name: unipi-jupyter-lab
    restart: always
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    working_dir: /workspace/Data-Mining
    command: >
      bash -c "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''"
